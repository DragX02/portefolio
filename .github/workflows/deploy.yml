name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy files
        run: |
          # creer le dossier s'il n'existe pas
          sudo mkdir -p /var/www/portefolio
          # synchroniser les fichiers, config.php exclu pour ne pas ecraser les credentials
          sudo rsync -av --delete --exclude='.git*' --exclude='config/config.php' ./ /var/www/portefolio/

      - name: Set permissions
        run: |
          # ajuster les droits pour que Nginx puisse lire le site
          sudo chmod -R 755 /var/www/portefolio/
          sudo chown -R www-data:www-data /var/www/portefolio/

      - name: Reload Nginx
        run: |
          # recharger Nginx pour appliquer les changements
          sudo systemctl reload nginx
